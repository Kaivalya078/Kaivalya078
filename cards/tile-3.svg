<svg xmlns="http://www.w3.org/2000/svg" width="292" height="150" viewBox="0 0 292 150" role="img" aria-label="LinkedIn: Kaivalya Patel"><title>LinkedIn: Kaivalya Patel</title><style>@font-face{font-family:'KP Mono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'KP Sans';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'KP Sans';font-weight:600;src:url(data:font/woff;base64,) format('woff')}
