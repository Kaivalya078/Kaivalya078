name: README cards

on:
  schedule:
    - cron: "17 0 * * *" # daily, 05:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cards.toml
      - scripts/render_readme_cards.py
      - assets/**
      - .github/workflows/readme-cards.yml

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fonttools pillow

      - name: Refresh contribution data
        env:
          # Optional: a personal access token (read:user) saved as the CARDS_TOKEN
          # secret also counts your private contributions. Without it the
          # workflow's own token is used, which sees public activity only.
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/render_readme_cards.py fetch

      - name: Render cards
        run: python scripts/render_readme_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data README.md
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "Refresh README cards"
            git push
          fi
